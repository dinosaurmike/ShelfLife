  <style>
    :root {
      --bg-dark: #faf5ee;
      --bg-panel: #ffffff;
      --bg-input: #f5efe6;
      --text-main: #333333;
      --accent-hover: #b8962c;
      --border: #dcd3c6;
    }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      margin: 0; padding: 0;
      background: var(--bg-dark); color: var(--text-main);
      display: flex; height: 100vh; overflow: hidden;
    }
    #sidebar {
      width: 360px; flex-shrink: 0;
      background: var(--bg-panel); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; overflow-y: auto;
    }
    .sidebar-header { padding: 20px; border-bottom: 1px solid var(--border); }
    .sidebar-header h1 { font-family: 'Playfair Display', serif; font-size: 20px; margin: 0 0 4px 0; }
    .sidebar-content { padding: 20px; display: flex; flex-direction: column; gap: 20px; }
    .input-group { display: flex; flex-direction: column; gap: 8px; }
    .input-group label { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    input[type="text"], input[type="number"] { padding: 10px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg-input); }
    .btn { padding: 12px; border: none; border-radius: 4px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    .btn-primary { background: #d4af37; color: white; }
    .btn-primary:hover { background: var(--accent-hover); }
    #workspace { flex-grow: 1; overflow: auto; display: flex; justify-content: center; align-items: flex-start; padding: 40px; }
    #svgContainer svg { box-shadow: 0 10px 30px rgba(0,0,0,0.1); background: white; }
    .checkbox-group { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .dropdown-results {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: white;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      max-height: 200px;
      overflow-y: auto;
      z-index: 1000;
      margin-top: 4px;
    }
    .dropdown-results div.result-item {
      padding: 8px 12px;
      cursor: pointer;
      font-size: 13px;
      border-bottom: 1px solid #eee;
      color: #333;
    }
    .dropdown-results div.result-item:hover {
      background: #f0f0f0;
    }
    .dropdown-results div.result-item:last-child {
      border-bottom: none;
    }
    .dropdown-results .subtext {
      font-size: 11px;
      color: #888;
      display: block;
    }
      
      /* Auth Gate */
      .auth-gate { max-width: 380px; margin: 80px auto; background: white; border: 1px solid #ccc; border-radius: 6px; padding: 36px; box-shadow: 0 20px 50px rgba(0,0,0,0.15); }

      .auth-gate p { font-size: 12px; color: #888; margin-bottom: 22px; }
      .auth-gate label { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: #888; display: block; margin-bottom: 6px; margin-top: 14px; }

      let currentZoom = 1;
      let panX = 0;
      let panY = 0;
      let isDragging = false;
      let startX = 0;
      let startY = 0;

      function updateTransform() {
          const container = document.getElementById('svgContainer');
          if (container) {
              container.style.transform = `translate(${panX}px, ${panY}px) scale(${currentZoom})`;
          }
      }

      function zoom(factor) {
          currentZoom *= factor;
          updateTransform();
      }

      function zoomReset() {
          currentZoom = 1;
          panX = 0;
          panY = 0;
          updateTransform();
      }

      window.addEventListener('DOMContentLoaded', () => {
          const workspace = document.getElementById('workspace');
          workspace.style.overflow = 'hidden';
          workspace.style.cursor = 'grab';
          
          workspace.addEventListener('mousedown', (e) => {
              if (e.target.closest('button') || e.target.closest('input')) return;
              isDragging = true;
              startX = e.clientX - panX;
              startY = e.clientY - panY;
              workspace.style.cursor = 'grabbing';
          });
          
          window.addEventListener('mousemove', (e) => {
              if (!isDragging) return;
              e.preventDefault();
              panX = e.clientX - startX;
              panY = e.clientY - startY;
              updateTransform();
          });
          
          window.addEventListener('mouseup', () => {
              isDragging = false;
              workspace.style.cursor = 'grab';
          });
      });

    function renderHersheyText(textStr, fontSize = 150, textAnchor = 'start', strokeClass = 'str1', kerning = 8, forceUpper = true, maxWidth = null, smallCaps = false) {
        if (!textStr || !window.HERSHEY || !window.HERSHEY['futural']) {
            let textLengthAttr = maxWidth ? ` textLength="${maxWidth}" lengthAdjust="spacingAndGlyphs"` : '';
            return `<text class="fil0 ${strokeClass}" x="0" y="0"${textLengthAttr} style="font-size: ${fontSize}px; font-weight: normal; font-family: sans-serif; text-anchor: ${textAnchor}; dominant-baseline: central;">${textStr}</text>`;
        }
        const font = window.HERSHEY['futural'];
        textStr = String(textStr);
        let totalWidth = 0;
        let glyphs = [];
        
        for (let i = 0; i < textStr.length; i++) {
          let char = textStr[i];
          let isLower = char >= 'a' && char <= 'z';
          let scaleMod = (smallCaps && isLower) ? 0.75 : 1.0;
          
          if (forceUpper || smallCaps) {
              char = char.toUpperCase();
          }
          let code = char.charCodeAt(0);
          
          if (code === 32) {
            totalWidth += (14 + kerning) * scaleMod;
            glyphs.push({ d: null, w: 14 + kerning, s: scaleMod });
          } else if (code >= 33 && code <= 126) {
            let g = font.chars[code - 33];
            if (g) {
              glyphs.push({ d: g.d, w: g.o + kerning, s: scaleMod });
              totalWidth += (g.o + kerning) * scaleMod;
            } else {
              glyphs.push({ d: null, w: 14 + kerning, s: scaleMod });
              totalWidth += (14 + kerning) * scaleMod;
            }
          }
        }
        
        let scale = fontSize / 21;
        if (maxWidth && totalWidth * scale > maxWidth) {
            scale = maxWidth / totalWidth;
        }
        
        let paths = `<g class="${strokeClass}">`;
        let curX = 0;
        if (textAnchor === 'middle') curX = -(totalWidth * scale) / 2;
        else if (textAnchor === 'end') curX = -(totalWidth * scale);
        
        glyphs.forEach(g => {
          let finalScale = scale * g.s;
          let yOffset = -11.5 * finalScale; // Perfectly center vertically (font spans 1 to 22 natively)
          if (g.s < 1.0) {
              yOffset = -11.5 * scale;
          }
          if (g.d) paths += `  <path d="${g.d}" transform="translate(${curX}, ${yOffset}) scale(${finalScale}, ${finalScale})" />\n`;
          curX += g.w * finalScale;
        });
        paths += `</g>`;
        return paths;
    }

    function polygonToRoundedPath(points, r) {
      let d = '';
      for (let i = 0; i < points.length; i++) {
          let pPrev = points[(i - 1 + points.length) % points.length];
          let pCurr = points[i];
          let pNext = points[(i + 1) % points.length];
          
          let dxPrev = pPrev.x - pCurr.x;
          let dyPrev = pPrev.y - pCurr.y;
          let lenPrev = Math.hypot(dxPrev, dyPrev);
          let uxPrev = dxPrev / lenPrev;
          let uyPrev = dyPrev / lenPrev;
          
          let dxNext = pNext.x - pCurr.x;
          let dyNext = pNext.y - pCurr.y;
          let lenNext = Math.hypot(dxNext, dyNext);
          let uxNext = dxNext / lenNext;
          let uyNext = dyNext / lenNext;
          
          let currentR = typeof r === 'function' ? r(pCurr, pPrev, pNext) : r;
          let actualR = Math.min(currentR, lenPrev / 2, lenNext / 2);
          
          let startArcX = pCurr.x + uxPrev * actualR;
          let startArcY = pCurr.y + uyPrev * actualR;
          let endArcX = pCurr.x + uxNext * actualR;
          let endArcY = pCurr.y + uyNext * actualR;
          
          if (i === 0) {
              d += `M ${startArcX.toFixed(2)} ${startArcY.toFixed(2)} `;
          } else {
              d += `L ${startArcX.toFixed(2)} ${startArcY.toFixed(2)} `;
          }
          
          d += `Q ${pCurr.x.toFixed(2)} ${pCurr.y.toFixed(2)} ${endArcX.toFixed(2)} ${endArcY.toFixed(2)} `;
      }
      d += 'Z';
      return d;
    }

    function simplifyPoints(points) {
        let simple = [points[0]];
        for (let i = 1; i < points.length; i++) {
            let pPrev = simple[simple.length - 1];
            let pCurr = points[i];
            if (pCurr.x === pPrev.x && pCurr.y === pPrev.y) continue;
            
            if (simple.length >= 2) {
                let pPrevPrev = simple[simple.length - 2];
                if (Math.abs(pPrevPrev.y - pPrev.y) < 0.1 && Math.abs(pPrev.y - pCurr.y) < 0.1) {
                    simple[simple.length - 1] = pCurr;
                    continue;
                }
                if (Math.abs(pPrevPrev.x - pPrev.x) < 0.1 && Math.abs(pPrev.x - pCurr.x) < 0.1) {
                    simple[simple.length - 1] = pCurr;
                    continue;
                }
            }
            simple.push(pCurr);
        }
        while (simple.length >= 3) {
            let n = simple.length;
            if (Math.abs(simple[0].y - simple[n-1].y) < 0.1 && Math.abs(simple[n-1].y - simple[n-2].y) < 0.1) {
                simple.pop();
            } else if (Math.abs(simple[0].x - simple[n-1].x) < 0.1 && Math.abs(simple[n-1].x - simple[n-2].x) < 0.1) {
                simple.pop();
            } else {
                break;
            }
        }
        return simple;
    }

    function offsetOrthogonalPolygon(points, d) {
        let offsetPoints = [];
        for (let i = 0; i < points.length; i++) {
            let pPrev = points[(i - 1 + points.length) % points.length];
            let pCurr = points[i];
            let pNext = points[(i + 1) % points.length];
            
            let dxPrev = pCurr.x - pPrev.x;
            let dyPrev = pCurr.y - pPrev.y;
            let lenPrev = Math.hypot(dxPrev, dyPrev);
            let nxPrevVal = dyPrev / lenPrev;
            let nyPrevVal = -dxPrev / lenPrev;
            
            let dxNext = pNext.x - pCurr.x;
            let dyNext = pNext.y - pCurr.y;
            let lenNext = Math.hypot(dxNext, dyNext);
            let nxNextVal = dyNext / lenNext;
            let nyNextVal = -dxNext / lenNext;
            
            let shiftX = d * nxPrevVal + d * nxNextVal;
            let shiftY = d * nyPrevVal + d * nyNextVal;
            
            offsetPoints.push({
                x: pCurr.x + shiftX,
                y: pCurr.y + shiftY
            });
        }
        return offsetPoints;
    }

    function updateSVG() {
      if (!currentBooksData || currentBooksData.length === 0) return;
      const container = document.getElementById('svgContainer');
      const ownerName = document.getElementById('txtOwner').value || 'Test User';
      const year = document.getElementById('txtYear').value || new Date().getFullYear();
      const removeGaps = document.getElementById('chkRemoveGaps').checked;
      
      const sortType = document.getElementById('sortBooks').value || 'chronological';
      const excludeLong = document.getElementById('chkExcludeLongTitles').checked;
      const excludeMissing = document.getElementById('chkExcludeMissingData').checked;

      let filteredBooks = currentBooksData.filter(b => {
          if (excludeLong && b.title && b.title.length > 35) return false;
          if (excludeMissing && (!b.word_count || !b.days)) return false;
          return true;
      });
      
      const monthOrder = {
          'January': 1, 'February': 2, 'March': 3, 'April': 4,
          'May': 5, 'June': 6, 'July': 7, 'August': 8,
          'September': 9, 'October': 10, 'November': 11, 'December': 12
      };
      
      filteredBooks.sort((a, b) => {
          if (sortType === 'word_count') {
              return (parseFloat(b.word_count) || 0) - (parseFloat(a.word_count) || 0);
          } else if (sortType === 'genre') {
              if (a.fiction === b.fiction) {
                  let m1 = monthOrder[a.month_finished] || 99;
                  let m2 = monthOrder[b.month_finished] || 99;
                  return m1 - m2;
              }
              return (a.fiction ? 1 : 0) - (b.fiction ? 1 : 0);
          } else {

                  let cornerPathStats = `M ${OUTER_X + 120 + 150},${OUTER_Y + OUTER_H - 120} L ${OUTER_X + 120 + 80},${OUTER_Y + OUTER_H - 120} A 80 80 0 0 1 ${OUTER_X + 120},${OUTER_Y + OUTER_H - 120 - 80} L ${OUTER_X + 120},${OUTER_Y + OUTER_H - 120 - 150}`;

                  // b1 rect intentionally omitted to merge borders!
                  
              
              
              let numBooks = books.filter(b=>!b.isGap).length;

              let wordsStr = (totalW >= 1000000 ? (totalW / 1000000).toFixed(1).replace(/\.0$/, '') + 'M' : Math.round(totalW / 1000) + 'K') + " WORDS";
              let totalDays = Math.round(books.reduce((sum,b)=>!b.isGap?sum+(b.days||0):sum,0));
              
              let line2 = `${numBooks} BOOKS`;

              let numTitleF = statsBoxSize * 0.19;

              let y4 = statsBoxSize * 0.88;

              let groupShift = numTitleF * 1.47; // Slightly tweaked optical center
                qrCodeSVG += `<g transform="translate(${statsBoxSize/2 - groupShift}, ${y1})">\n`;

                let lx1 = statsBoxSize * 0.05; // Extended left

      const baseDoodleLibrary = [

      let procedurals = '';

      let rSetback = 60;

        headerMasks.push({ minX: headerCenterX + stackOffset - rSetback, maxX: headerCenterX + stackOffset + wYear + rSetback, minY: (OUTER_Y + 750) - asc - rSetback, maxY: (OUTER_Y + 750) + desc + rSetback });
        
        let nameWords = namePart.split(' ');
        let startNameX = headerCenterX - stackOffset - scaledNameWidth;
        let prefix = "";
        let wordSetbackX = 15; 
        
        for (let i = 0; i < nameWords.length; i++) {

            headerMasks.push({

        // --- ADD FLOURISHES ---

        }
        
        let yearEndX = headerCenterX + stackOffset + wYear;
        let rightStartX = yearEndX + 200;
        let rightEndX = INNER_X + INNER_W - 200;
        let rightW = rightEndX - rightStartX;
        
        if (rightW > 200) {
            headerFlourishes += `<path d="M ${rightStartX},${tildeY} C ${rightStartX + rightW*0.3},${tildeY - 150} ${rightEndX - rightW*0.3},${tildeY + 150} ${rightEndX},${tildeY}" fill="none" stroke="rgb(0,255,0)" stroke-width="1" vector-effect="non-scaling-stroke"/>\n`;
            headerFlourishes += `<polygon points="${rightStartX-20},${tildeY} ${rightStartX},${tildeY-20} ${rightStartX+20},${tildeY} ${rightStartX},${tildeY+20}" fill="none" stroke="rgb(0,255,0)" stroke-width="1" vector-effect="non-scaling-stroke"/>\n`;
            headerFlourishes += `<polygon points="${rightEndX-20},${tildeY} ${rightEndX},${tildeY-20} ${rightEndX+20},${tildeY} ${rightEndX},${tildeY+20}" fill="none" stroke="rgb(0,255,0)" stroke-width="1" vector-effect="non-scaling-stroke"/>\n`;
            
            // Ultra-tight mask for right side
            headerMasks.push({ minX: rightStartX, maxX: rightEndX, minY: tildeY - 60, maxY: tildeY + 60 });
        }
        
        let bookmarkMasks = [];
      monthBlocks.forEach(block => {
          if (block.month === 'Unknown') return;
          let centerX = (block.left + block.right) / 2;
          let bookmarkWidth = 350;
          let bookmarkHeight = 500 + ((block.word_count || 0) / (maxWordCount || 1)) * 440;
          let bStartX = centerX - (bookmarkWidth / 2);
          let bStartY = BASELINE_Y + 360;
          let outset = 30;
          bookmarkMasks.push({
              minX: bStartX - outset - rSetback,
              maxX: bStartX + bookmarkWidth + outset + rSetback,
              minY: bStartY - rSetback,
              maxY: bStartY + bookmarkHeight + outset + rSetback
          });
      });

      for (let i = 0; i < MAX_ATTEMPTS && placedDoodles.length < TOTAL_DOODLES; i++) {
        const doodle = doodleLibrary[Math.floor(Math.random() * doodleLibrary.length)];
        const scale = 4.8 + (Math.random() * 3.2); 
        const rotation = Math.random() * 360;
        let radius = Math.hypot(doodle.w / 2, doodle.h / 2) * scale;
        if (doodle.type === "pencil") radius *= 0.75;
        
        const rx = OUTER_X + Math.random() * OUTER_W;
        const ry = OUTER_Y + Math.random() * OUTER_H;
        
        if (rx - radius < outMinX || rx + radius > outMaxX || ry - radius < outMinY || ry + radius > outMaxY) continue;
        if (rx + radius > inMinX && rx - radius < inMaxX && ry + radius > inMinY && ry - radius < inMaxY) continue;
        let hitHeader = false;
          for (let m = 0; m < headerMasks.length; m++) {
              let hm = headerMasks[m];
              if (rx + radius > hm.minX && rx - radius < hm.maxX && ry + radius > hm.minY && ry - radius < hm.maxY) hitHeader = true;
          }
          if (hitHeader) continue;
        let hitBookmark = false;
        for (let m = 0; m < bookmarkMasks.length; m++) {
            let bm = bookmarkMasks[m];
            if (rx + radius > bm.minX && rx - radius < bm.maxX && ry + radius > bm.minY && ry - radius < bm.maxY) hitBookmark = true;
        }
        if (hitBookmark) continue;
        if (qrSize > 0) {
            if (rx + radius > qrX - 60 - rSetback && rx - radius < qrX + qrSize + 60 + rSetback && ry + radius > qrY - 60 - rSetback && ry - radius < qrY + qrSize + 320 + rSetback) continue;

        if (statsBoxSize > 0) {

        const padding = 15;

        let collision = false;
        for (let j = 0; j < placedDoodles.length; j++) {

        }
      }
      
      let clipPathD = `${offsetPath} ${innerOffsetPath}`;
      
      const svg = `<svg width="100%" height="80vh" style="background:#f0f0f0;" viewBox="${OUTER_X-500} ${OUTER_Y-500} ${OUTER_W+1000} ${OUTER_H+1000}" xmlns="http://www.w3.org/2000/svg">

        <path class="str2" d="${outerPath}" />
        <path class="str0" d="${offsetPath}" />

          <!-- Bookshelf Hedras -->

            </g>
        
        <!-- Background Doodles -->
        <g clip-path="url(#doodle-mask)">
           ${procedurals}

        <!-- Engraved Header -->
          ${headerFlourishes}
        <text x="${headerCenterX - stackOffset}" y="${OUTER_Y + 750}" style="font-size: ${nameFontSize}px; font-weight: 700; font-family: 'Playfair Display', Georgia, serif; font-style: italic; text-anchor: end; dominant-baseline: central; fill: none; stroke: rgb(0,255,0); stroke-width: 1px; vector-effect: non-scaling-stroke;">${ownerName.toUpperCase()}</text>

        <!-- Details -->
          <!-- We generate be true to yourshelf dynamically to italicize shelf -->
          ${(() => {
              let text1 = "be true to your";
              let text2 = "shelf";
              let f = (window.HERSHEY && window.HERSHEY['futural']) ? window.HERSHEY['futural'] : null;
              if (!f) return '';
              let w1 = 0, w2 = 0;
              for(let i=0; i<text1.length; i++) {
                  let c = text1.toUpperCase().charCodeAt(i);
                  if (c === 32) w1 += 14 + 8;
                  else if (f.chars[c-33]) w1 += f.chars[c-33].o + 8;
                  else w1 += 14 + 8;
              }
              for(let i=0; i<text2.length; i++) {
                  let c = text2.toUpperCase().charCodeAt(i);
                  if (c === 32) w2 += 14 + 8;
                  else if (f.chars[c-33]) w2 += f.chars[c-33].o + 8;

              let scale = 65 / 21;
              w1 *= scale; w2 *= scale;
              let overlap = 20 * scale;
              let totalW = w1 + w2 - overlap;
              let startX = -(totalW / 2);
              let svg1 = renderHersheyText(text1, 65, 'start', 'str1', 8, false);

                     `<g transform="translate(${startX + w1 - overlap}, 0) skewX(-15)">${svg2}</g>` +
                     `</g>`;
          })()}

          ${Array.from({length: Math.ceil(OUTER_W / 960) + 1}).map((_, i) => {
            let tickX = OUTER_X + (i * 960);
            let html = `<line x1="${tickX}" y1="${OUTER_Y + OUTER_H + 300}" x2="${tickX}" y2="${OUTER_Y + OUTER_H + 500}" style="stroke: blue; stroke-width: 4px;" />`;
            if (i < Math.floor(OUTER_W / 960)) {
              html += `<text x="${tickX + 480}" y="${OUTER_Y + OUTER_H + 400}" text-anchor="middle" dominant-baseline="central" style="fill: blue; stroke: white; stroke-width: 25px; paint-order: stroke fill;">${i + 1}"</text>`;

            if (i < Math.floor(OUTER_H / 960)) {
              html += `<text x="${OUTER_X - 400}" y="${tickY - 480}" text-anchor="middle" dominant-baseline="central" style="fill: blue; stroke: white; stroke-width: 25px; paint-order: stroke fill;">${i + 1}"</text>`;

          }).join('')}

    function downloadSVG() {
        const container = document.getElementById('svgContainer');
        const svgElement = container.querySelector('svg');
        if (!svgElement) return;
        const clone = svgElement.cloneNode(true);
        clone.removeAttribute('width');
        clone.removeAttribute('height');
        
        const ruler = clone.querySelector('#ruler');
        if (ruler) ruler.remove();
        
        // Enforce hairlines for laser cutting on export!
        let finalSVGHTML = clone.outerHTML.replace(/stroke-width:\s*1px/g, 'stroke-width: 0.001in');
          
        const blob = new Blob([finalSVGHTML], {type: "image/svg+xml;charset=utf-8"});
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "shelfcare-laser.svg";
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    window.onload = () => {
      checkSession();
    };
    
    async function checkSession() {
      if(!_supabase){ showAuth('Could not connect to the database.'); return; }
      const { data } = await _supabase.auth.getSession();
      if(data && data.session && isAdminUser(data.session.user)){
        showDashboard(data.session.user);
      } else {
        showAuth(data && data.session ? 'Access denied. Administrator privileges required.' : '');
      }
    }
    
    function showAuth(msg){
      document.getElementById('authGate').style.display='block';
      document.getElementById('dashboard').style.display='none';
      if(msg) document.getElementById('authErr').textContent = msg;
    }
    
    function showDashboard(user){
      document.getElementById('authGate').style.display='none';
      document.getElementById('dashboard').style.display='flex';
      initDashboard();
      
      if(_supabase) {
          _supabase.rpc('get_admin_users').then(({data}) => {
              if(data && Array.isArray(data)) {
                  adminUsersCache = data;
              }
          });
      }
    }
    
    async function handleSignIn() {
      const email=document.getElementById('emailInput').value.trim();
      const password=document.getElementById('passwordInput').value;
      const errEl=document.getElementById('authErr'); errEl.textContent='';
      if(!email||!password){ errEl.textContent='Enter your email and password.'; return; }
      const { data, error } = await _supabase.auth.signInWithPassword({ email, password });
      if(error){ errEl.textContent=error.message; return; }
      if(data && data.user) {
        if (isAdminUser(data.user)) {
          showDashboard(data.user);
        } else {
          errEl.textContent = 'Access denied. Administrator privileges required.';
        }
      }
    }

    function initDashboard() {
      const input = document.getElementById('shelfIdInput');
      const resultsDiv = document.getElementById('searchResults');
      
      input.addEventListener('input', (e) => {
          clearTimeout(searchTimeout);
          const val = e.target.value.trim();
          if (val.length < 2) {
              resultsDiv.style.display = 'none';
              return;
          }
          searchTimeout = setTimeout(() => performSearch(val), 300);
      });
      
      document.addEventListener('click', (e) => {
          if (!input.contains(e.target) && !resultsDiv.contains(e.target)) {
              resultsDiv.style.display = 'none';
          }
      });

      const params = new URLSearchParams(window.location.search);
      const autoShelf = params.get('shelf');
      if (autoShelf) {
        document.getElementById('shelfIdInput').value = autoShelf;
        fetchAndGenerate();
      } else {
        document.getElementById('shelfIdInput').value = "DEMO";
        fetchAndGenerate();
      }
    }
  </script>
</body>
</html>
