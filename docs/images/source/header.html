<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Source for docs/images/shelflife-header.png (1280 × 640, also GitHub's social preview size).
     Render: open in a browser at 1280 × 640 and screenshot, or `node docs/images/source/render.mjs`. -->
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Outfit:wght@400;500&family=Playfair+Display:ital,wght@0,700;0,900;1,400&display=swap" rel="stylesheet">
<style>
  :root { --cream: #FAF8F5; --paper: #F3EEE6; --ink: #2B211A; --burgundy: #8B2635; --gold: #D4AF37; --wood: #6B4A31; --wood-dark: #3D2B1F; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; background: var(--cream); }
  body { position: relative; font-family: 'Outfit', sans-serif; color: var(--ink); }

  /* soft paper texture: two faint radial washes */
  body::before { content: ''; position: absolute; inset: 0;
    background: radial-gradient(900px 500px at 15% 10%, #fff 0%, transparent 60%),
                radial-gradient(800px 500px at 90% 100%, #efe6d8 0%, transparent 65%); }

  .left { position: absolute; left: 92px; top: 0; bottom: 0; width: 520px; display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 22px; }
  .logo { width: 74px; height: 92px; }
  h1 { font-family: 'Playfair Display', serif; font-weight: 900; font-size: 92px; letter-spacing: -1.5px; line-height: 1; }
  h1 span { color: var(--burgundy); }
  .rule { width: 72px; height: 3px; background: var(--gold); margin: 30px 0 26px; border-radius: 2px; }
  .tag { font-family: 'Playfair Display', serif; font-style: italic; font-size: 30px; line-height: 1.3; color: #4a3a2e; }
  .mono { margin-top: 28px; font-family: 'DM Mono', monospace; font-size: 15px; letter-spacing: 0.22em; text-transform: uppercase; color: #8a7663; }

  /* the shelf */
  .shelf-wrap { position: absolute; right: 70px; top: 96px; width: 560px; height: 448px; }
  .unit { position: absolute; inset: 0; border-radius: 10px;
    background: linear-gradient(180deg, #5a3d28, #4a3220); box-shadow: 0 30px 60px rgba(61,43,31,0.28), inset 0 0 0 10px #6b4a31; }
  .back { position: absolute; left: 10px; right: 10px; top: 10px; bottom: 10px; border-radius: 4px;
    background: linear-gradient(180deg, #2e2019, #3a281d); }
  .row { position: absolute; left: 22px; right: 22px; height: 176px; display: flex; align-items: flex-end; gap: 3px; }
  .row.r1 { top: 30px; } .row.r2 { top: 236px; }
  .plank { position: absolute; left: 10px; right: 10px; height: 18px; border-radius: 2px;
    background: linear-gradient(180deg, #8a6243, #6b4a31 55%, #5a3d28); box-shadow: 0 6px 10px rgba(0,0,0,0.35); }
  .plank.p1 { top: 206px; } .plank.p2 { top: 412px; }

  .spine { position: relative; border-radius: 3px 3px 1px 1px; flex: none; overflow: hidden;
    box-shadow: inset -6px 0 10px rgba(0,0,0,0.28), inset 5px 0 8px rgba(255,255,255,0.14); }
  .spine::before { /* headband: the sentiment colour */
    content: ''; position: absolute; left: 0; right: 0; top: 0; height: 9px; background: var(--band, var(--gold)); opacity: 0.95; }
  .spine[style*="height:2"]::after, .spine[style*="height:20"]::after { display:none } .spine::after { /* two gilt rules */
    content: ''; position: absolute; left: 6px; right: 6px; bottom: 16px; height: 6px;
    border-top: 1.5px solid rgba(212,175,55,0.75); border-bottom: 1.5px solid rgba(212,175,55,0.75); }
  .spine b { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(-90deg); white-space: nowrap;
    font-family: 'Playfair Display', serif; font-weight: 700; font-size: 15px; color: rgba(255,248,235,0.92); letter-spacing: 0.5px; }
  .lean { transform: rotate(-9deg); transform-origin: bottom left; margin-left: 18px; }
  .trinket { flex: none; align-self: flex-end; margin: 0 10px 0 14px; }

  .badge { position: absolute; right: 26px; bottom: 26px; font-family: 'DM Mono', monospace; font-size: 13px;
    letter-spacing: 0.2em; color: #9b8670; text-transform: uppercase; }
</style>
</head>
<body>
  <div class="left">
    <div class="brand">
      <svg class="logo" viewBox="128 32 256 448" aria-hidden="true">
        <path d="M 128 64 C 128 46 142 32 160 32 L 352 32 C 370 32 384 46 384 64 L 384 480 L 256 384 L 128 480 Z" fill="#8B2635"/>
        <circle cx="256" cy="96" r="16" fill="#FAF8F5"/>
        <path d="M 176 236 C 210 214 240 230 256 252 C 272 230 302 214 336 236 L 336 326 C 302 302 272 318 256 344 C 240 318 210 302 176 326 Z" fill="#FAF8F5"/>
        <path d="M 256 252 L 256 344" stroke="#8B2635" stroke-width="6"/>
      </svg>
      <h1>Shelf<span>Life</span></h1>
    </div>
    <div class="rule"></div>
    <div class="tag">A reading tracker that feels like<br>your own wooden bookshelf.</div>
    <div class="mono">Log · Shelve · Remember · Share</div>
  </div>

  <div class="shelf-wrap">
    <div class="unit"></div>
    <div class="back"></div>
    <div class="plank p1"></div>
    <div class="plank p2"></div>
    <!-- Headband colours follow the app's sentiment bands: loved (gold), liked (green), mixed (slate), disliked (rust) -->
    <div class="row r1">
      <div class="spine" style="width:44px;height:150px;background:#8B2635;--band:#D4AF37"><b>Dune</b></div>
      <div class="spine" style="width:36px;height:132px;background:#2F4858;--band:#7FA36B"><b>Circe</b></div>
      <div class="spine" style="width:52px;height:164px;background:#4E5D3B;--band:#D4AF37"><b>Middlemarch</b></div>
      <div class="spine" style="width:30px;height:120px;background:#B5653A;--band:#8C9AA6"><b>Klara</b></div>
      <div class="spine" style="width:40px;height:146px;background:#3D2B1F;--band:#D4AF37"><b>Piranesi</b></div>
      <div class="spine" style="width:34px;height:128px;background:#6E4A7E;--band:#7FA36B"><b>Rebecca</b></div>
      <div class="spine lean" style="width:42px;height:150px;background:#A47E3B;--band:#D4AF37"><b>The Hobbit</b></div>
      <svg class="trinket" width="54" height="70" viewBox="0 0 54 70" aria-hidden="true"><!-- a small potted plant -->
        <path d="M10 44 h34 l-5 24 h-24 z" fill="#B5653A"/><rect x="8" y="40" width="38" height="7" rx="2" fill="#C97A4B"/>
        <path d="M27 40 C 20 26 8 24 6 12 C 18 14 25 24 27 40 Z" fill="#5E7D4C"/><path d="M27 40 C 32 24 44 22 48 8 C 36 12 29 22 27 40 Z" fill="#6E8F57"/>
        <path d="M27 40 C 26 28 28 16 27 4 C 31 16 30 28 27 40 Z" fill="#7FA36B"/>
      </svg>
      <div class="trinket" style="margin-left:6px;display:flex;flex-direction:column;gap:2px;align-items:flex-start">
        <div class="spine" style="width:92px;height:20px;background:#2F4858;--band:transparent"></div>
        <div class="spine" style="width:104px;height:24px;background:#8B2635;--band:transparent"></div>
        <div class="spine" style="width:98px;height:22px;background:#A47E3B;--band:transparent"></div>
      </div>
    </div>
    <div class="row r2">
      <svg class="trinket" width="44" height="60" viewBox="0 0 44 60" aria-hidden="true"><!-- a candle -->
        <rect x="10" y="22" width="24" height="36" rx="3" fill="#F3EEE6"/><rect x="6" y="54" width="32" height="6" rx="2" fill="#D4AF37"/>
        <path d="M22 4 C 28 12 27 18 22 21 C 17 18 16 12 22 4 Z" fill="#F2B544"/><path d="M22 10 C 25 14 24 18 22 20 C 20 18 19 14 22 10 Z" fill="#FBE3A0"/>
      </svg>
      <div class="spine" style="width:38px;height:140px;background:#1F3B4D;--band:#D4AF37"><b>Beloved</b></div>
      <div class="spine" style="width:48px;height:160px;background:#7A2E2A;--band:#7FA36B"><b>War &amp; Peace</b></div>
      <div class="spine" style="width:32px;height:124px;background:#5B6B4A;--band:#B5653A"><b>Pachinko</b></div>
      <div class="spine" style="width:44px;height:152px;background:#2B211A;--band:#D4AF37"><b>Jane Eyre</b></div>
      <div class="spine" style="width:36px;height:134px;background:#8B6B3E;--band:#8C9AA6"><b>Atonement</b></div>
      <div class="spine" style="width:40px;height:146px;background:#45325A;--band:#D4AF37"><b>Emma</b></div>
      <div class="spine" style="width:46px;height:158px;background:#8B2635;--band:#7FA36B"><b>Babel</b></div>
      <div class="spine" style="width:30px;height:118px;background:#33505C;--band:#D4AF37"><b>Stoner</b></div>
      <div class="spine" style="width:42px;height:150px;background:#6B4A31;--band:#7FA36B"><b>Persuasion</b></div>
      <div class="spine lean" style="width:36px;height:138px;background:#4E5D3B;--band:#D4AF37"><b>Walden</b></div>
    </div>
  </div>
</body>
</html>
