<!doctype html><html><head><meta charset="utf-8">
<!-- Source for docs/images/orbit-header.gif (README) and orbit-header.png (social preview).
     A 6-second seamless loop: holographic shimmer, a blink, a look left and right, a happy smile.
     Render frames with render-gif.js; draw(t) is deterministic, t in seconds. -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<canvas id="c"></canvas>
<script>
const P = new URLSearchParams(location.search);
const W = +(P.get('w') || 1280), H = +(P.get('h') || 640);
const LOOP = 6;
const c = document.getElementById('c'); c.width = W; c.height = H;
const g = c.getContext('2d');

const ease = x => x < 0 ? 0 : x > 1 ? 1 : x * x * (3 - 2 * x);
// 0 → 1 → 0 over [a, b], rising and falling in `edge` seconds
const pulse = (t, a, b, edge) => ease((t - a) / edge) * (1 - ease((t - (b - edge)) / edge));

// One eye: an ellipse ring (rx, ry), opened at the bottom by `gap` degrees for the happy ^ arch
function ring(x, y, rx, ry, gapDeg, color, width, alpha, blur) {
  g.save(); g.globalCompositeOperation = 'lighter'; g.globalAlpha = alpha;
  g.strokeStyle = color; g.lineWidth = width; g.lineCap = 'round';
  if (blur) { g.shadowColor = color; g.shadowBlur = blur; }
  const gap = gapDeg * Math.PI / 180;
  g.beginPath(); g.ellipse(x, y, rx, ry, 0, Math.PI / 2 + gap / 2, Math.PI / 2 + 2 * Math.PI - gap / 2); g.stroke();
  g.restore();
}
function eye(x, y, r, open, squash, look, gapDeg, t, side) {
  const rx = r * (1 - 0.18 * Math.abs(look)) * (1 + 0.08 * squash);
  const ry = Math.max(r * open * (1 - 0.42 * squash), 1.2);
  const w = r * 0.26 * (0.75 + 0.25 * open);
  // fringes drift slowly around the ring (the holographic shimmer)
  const a = t / LOOP * 2 * Math.PI + side;
  const dx = Math.cos(a) * w * 0.3, dy = Math.sin(a) * w * 0.18;
  ring(x, y, rx, ry, gapDeg, '#5ce1ff', w * 2.6, 0.10, r * 0.6);
  ring(x - dx, y - dy, rx, ry, gapDeg, '#00f0ff', w, 0.75, w * 0.8);
  ring(x + dx, y + dy, rx, ry, gapDeg, '#ff2bd6', w, 0.65, w * 0.8);
  ring(x, y, rx, ry, gapDeg, '#ffffff', w * 0.7, 1, w * 0.5);
  if (open > 0.3 && gapDeg < 20) {
    // a pastel sheen arc turning slowly, and a glint gliding round the rim
    g.save(); g.globalCompositeOperation = 'lighter'; g.globalAlpha = 0.35 * open;
    g.strokeStyle = '#b794ff'; g.lineWidth = w * 0.5;
    const s = -2.4 + t / LOOP * 2 * Math.PI;
    g.beginPath(); g.ellipse(x, y, rx, ry, 0, s, s + 1.0); g.stroke(); g.restore();
    const ga = -0.9 + t / LOOP * 2 * Math.PI * 2;
    g.save(); g.globalCompositeOperation = 'lighter';
    const gx = x + Math.cos(ga) * rx, gy = y + Math.sin(ga) * ry;
    const glint = g.createRadialGradient(gx, gy, 0, gx, gy, w * 1.4);
    glint.addColorStop(0, 'rgba(255,255,255,0.9)'); glint.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = glint; g.beginPath(); g.arc(gx, gy, w * 1.4, 0, 2 * Math.PI); g.fill(); g.restore();
  }
}

function draw(t) {
  t = ((t % LOOP) + LOOP) % LOOP;
  g.globalCompositeOperation = 'source-over'; g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
  const bg = g.createRadialGradient(W * 0.27, H * 0.5, 0, W * 0.27, H * 0.5, W * 0.45);
  bg.addColorStop(0, 'rgba(20,40,60,0.55)'); bg.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = bg; g.fillRect(0, 0, W, H);

  // The performance: look left (1.4–2.4 s), look right (2.6–3.6 s), back; blinks at 1.0 and 4.0 s;
  // a happy smile 4.5–5.6 s; a gentle breath throughout
  const look = -0.8 * pulse(t, 1.3, 2.5, 0.35) + 0.8 * pulse(t, 2.5, 3.8, 0.35);
  const blink = (t0) => { const d = Math.abs(t - t0); return d < 0.12 ? 1 - d / 0.12 : 0; };
  const openL = 1 - 0.96 * Math.max(blink(1.0), blink(4.0));
  const openR = 1 - 0.96 * Math.max(blink(1.03), blink(4.03));
  const happy = pulse(t, 4.5, 5.6, 0.22);
  const breath = 1 + 0.015 * Math.sin(t / LOOP * 2 * Math.PI * 2);

  const r = H * 0.13 * breath;
  const cx = W * 0.27 + look * W * 0.05, cy = H * 0.5 + r * 0.25 * happy;
  const gap = r * 1.7 * (1 - 0.08 * Math.abs(look));
  eye(cx - gap, cy, r * (1 + 0.1 * look), openL, happy, look, 200 * happy, t, 0);
  eye(cx + gap, cy, r * (1 - 0.1 * look), openR, happy, look, 200 * happy, t, 2);

  // scan lines
  g.globalCompositeOperation = 'source-over';
  g.fillStyle = 'rgba(0,0,0,0.35)';
  for (let yy = 0; yy < H; yy += 4) g.fillRect(0, yy, W, 1.4);

  // the words
  g.fillStyle = '#f2f4f7'; g.textBaseline = 'middle';
  const tx = W * 0.53, ey = H * 0.5;
  g.font = `600 ${Math.round(H * 0.17)}px Inter, "Helvetica Neue", Arial, sans-serif`;
  g.fillText('Orbit', tx, ey - H * 0.09);
  g.fillStyle = '#8a93a3';
  g.font = `400 ${Math.round(H * 0.042)}px Inter, "Helvetica Neue", Arial, sans-serif`;
  ['An open-source AI desk companion.', 'An old Android phone becomes its face.']
    .forEach((l, i) => g.fillText(l, tx + 4, ey + H * 0.06 + i * H * 0.062));
}
window.draw = draw;
document.fonts.ready.then(() => { draw(0); window.ready = true; });
</script></body></html>
